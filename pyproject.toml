[project]
name = "agentis"
version = "0.3.0"
description = "Production-grade, provider-agnostic Python framework for building agentic AI systems"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiofiles>=23.0",
]

[project.scripts]
agentis = "agentis.cli:main"

[project.urls]
Homepage = "https://github.com/najeebthalakkatt/agentis"
Repository = "https://github.com/najeebthalakkatt/agentis"
Issues = "https://github.com/najeebthalakkatt/agentis/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
filesystem = []
shell = []
coding = []
web = ["httpx>=0.27"]
data = []
all-providers = ["anthropic>=0.30", "openai>=1.0"]
all = [
    "anthropic>=0.30",
    "openai>=1.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
