[project]
name = "agentis-ai"
version = "1.0.1"
description = "Production-grade, provider-agnostic Python framework for building agentic AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Najeeb Thalakkatt" },
]
keywords = ["agents", "llm", "ai", "agentic", "anthropic", "openai", "tools", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=23.0",
]

[project.scripts]
agentis = "agentis.cli:main"

[project.urls]
Homepage = "https://github.com/najeeb-thalakkatt/agentis"
Repository = "https://github.com/najeeb-thalakkatt/agentis"
Issues = "https://github.com/najeeb-thalakkatt/agentis/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
filesystem = []
shell = []
coding = []
web = ["httpx>=0.27"]
data = []
all-providers = ["anthropic>=0.30", "openai>=1.0"]
all = [
    "anthropic>=0.30",
    "openai>=1.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
