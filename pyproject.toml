[project]
name = "agentis"
version = "0.1.0"
description = "Production-grade, provider-agnostic Python framework for building agentic AI systems"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiofiles>=23.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
web = ["httpx>=0.25"]
all = [
    "anthropic>=0.30",
    "openai>=1.0",
    "httpx>=0.25",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
